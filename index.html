<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧮 Math Speed Challenge — Mental Addition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f7fa; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .card { background: #fff; border-radius: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 560px; width: 100%; padding: 2.5rem 2rem; text-align: center; }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .sub { font-size: 0.85rem; color: #8b95aa; margin-bottom: 1.5rem; }
    .game-area { margin: 1rem 0; }
    .numbers { font-size: 2.5rem; font-weight: bold; letter-spacing: 0.1em; color: #1e293b; min-height: 4rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; flex-wrap: wrap; }
    .numbers span { background: #eef0f5; padding: 0.25rem 0.75rem; border-radius: 0.5rem; }
    .plus { color: #8b95aa; font-size: 2rem; }
    .input-row { display: flex; gap: 0.5rem; justify-content: center; align-items: center; margin: 1.5rem 0; flex-wrap: wrap; }
    .input-row input { font-size: 1.5rem; width: 140px; padding: 0.5rem 0.75rem; border: 2px solid #d0d6e0; border-radius: 0.5rem; text-align: center; outline: none; transition: border-color 0.15s; }
    .input-row input:focus { border-color: #19a974; }
    .input-row button { font-size: 1.25rem; padding: 0.5rem 1.5rem; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; transition: transform 0.1s; }
    .btn-submit { background: #19a974; color: #fff; }
    .btn-submit:active { transform: scale(0.96); }
    .btn-next { background: #4a7cf7; color: #fff; }
    .btn-next:active { transform: scale(0.96); }
    .feedback { font-size: 1.25rem; font-weight: 600; min-height: 2.5rem; margin: 0.75rem 0; }
    .correct { color: #19a974; }
    .wrong { color: #e3495c; }
    .stats { display: flex; justify-content: center; gap: 2rem; margin: 1.5rem 0 0.5rem; font-size: 1.125rem; }
    .stats span { background: #f0f3f8; padding: 0.25rem 1rem; border-radius: 0.5rem; }
    .stats strong { font-size: 1.25rem; }
    .difficulty { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; }
    .difficulty button { font-size: 0.9rem; padding: 0.3rem 0.9rem; border: 2px solid #d0d6e0; border-radius: 0.5rem; cursor: pointer; background: #fff; transition: all 0.1s; }
    .difficulty button.active { border-color: #19a974; background: #e8faf1; font-weight: 600; }
    .difficulty button:active { transform: scale(0.96); }
    .footer { margin-top: 1.5rem; font-size: 0.85rem; color: #8b95aa; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧮 Math Speed Challenge</h1>
    <p class="sub">Mental Addition — sum the numbers</p>

    <div class="difficulty">
      <button data-level="easy">🟢 Easy (2 nums)</button>
      <button data-level="medium" class="active">🟡 Medium (3 nums)</button>
      <button data-level="hard">🔴 Hard (4 nums)</button>
    </div>

    <div class="game-area">
      <div class="numbers" id="numbersDisplay">
        <span>—</span> <span class="plus">+</span> <span>—</span>
      </div>

      <div class="input-row">
        <input type="number" id="answerInput" placeholder="?">
        <button class="btn-submit" id="submitBtn">↵ Submit</button>
        <button class="btn-next" id="nextBtn" hidden>Next →</button>
      </div>

      <div class="feedback" id="feedback"></div>
    </div>

    <div class="stats">
      <span>✅ Correct <strong id="correctCount">0</strong></span>
      <span>❌ Wrong <strong id="wrongCount">0</strong></span>
    </div>

    <div class="footer">
      Powered by <code>src/sum.js</code> &bull; Train your brain
    </div>
  </div>

  <script type="module">
    const difficulty = {
      easy:   { count: 2, max: 20 },
      medium: { count: 3, max: 50 },
      hard:   { count: 4, max: 99 }
    };

    let currentLevel = 'medium';
    let correctAnswer = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let answered = false;

    const numbersDisplay = document.getElementById('numbersDisplay');
    const answerInput   = document.getElementById('answerInput');
    const submitBtn     = document.getElementById('submitBtn');
    const nextBtn       = document.getElementById('nextBtn');
    const feedback      = document.getElementById('feedback');
    const correctSpan   = document.getElementById('correctCount');
    const wrongSpan     = document.getElementById('wrongCount');
    const diffBtns      = document.querySelectorAll('.difficulty button');

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function newQuestion() {
      const { count, max } = difficulty[currentLevel];
      const nums = [];
      for (let i = 0; i < count; i++) {
        nums.push(rand(1, max));
      }
      correctAnswer = nums.reduce((a, b) => a + b, 0);

      let html = '';
      nums.forEach((n, i) => {
        if (i > 0) html += ' <span class="plus">+</span>';
        html += '<span>' + n + '</span>';
      });
      html += ' <span class="plus">=</span> <span style="color:#8b95aa;">?</span>';
      numbersDisplay.innerHTML = html;

      answerInput.value = '';
      answerInput.disabled = false;
      answerInput.focus();
      submitBtn.hidden = false;
      nextBtn.hidden = true;
      feedback.textContent = '';
      feedback.className = '';
      answered = false;
    }

    function checkAnswer() {
      if (answered) return;
      const raw = answerInput.value.trim();
      if (raw === '') {
        feedback.textContent = 'Please enter your answer';
        return;
      }
      const guess = Number(raw);
      if (Number.isNaN(guess)) {
        feedback.textContent = 'Please enter a valid number';
        return;
      }

      answered = true;
      answerInput.disabled = true;
      submitBtn.hidden = true;
      nextBtn.hidden = false;

      if (guess === correctAnswer) {
        correctCount++;
        feedback.textContent = '✅ Correct! ' + correctAnswer;
        feedback.className = 'correct';
      } else {
        wrongCount++;
        feedback.textContent = '❌ Not quite… answer is ' + correctAnswer;
        feedback.className = 'wrong';
      }
      correctSpan.textContent = correctCount;
      wrongSpan.textContent   = wrongCount;
      nextBtn.focus();
    }

    submitBtn.addEventListener('click', checkAnswer);
    answerInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkAnswer();
    });
    nextBtn.addEventListener('click', newQuestion);

    diffBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        diffBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentLevel = btn.dataset.level;
        correctCount = 0;
        wrongCount   = 0;
        correctSpan.textContent = '0';
        wrongSpan.textContent   = '0';
        newQuestion();
      });
    });

    newQuestion();
  </script>
</body>
</html>
